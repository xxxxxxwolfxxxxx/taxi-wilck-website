<form class="ride" id="fahrt" name="fahrt" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/danke.html" aria-labelledby="h-ride">
      <h2 id="h-ride">Fahrt anfragen</h2>
      <input type="hidden" name="form-name" value="fahrt">
      <p class="hp"><label>Nicht ausfüllen: <input name="bot-field"></label></p>
      <label>Abholort*<input name="abholort" required autocomplete="street-address" enterkeyhint="next" placeholder="Straße, Ort" value="{{abholort}}"></label>
      <div class="two"><label>Name*<input name="name" required autocomplete="name" enterkeyhint="next"></label><label>Telefon*<input name="telefon" type="tel" inputmode="tel" required autocomplete="tel" enterkeyhint="next"></label></div>
      <label><span>Ziel <span class="opt">(optional, sonst am Telefon)</span></span><input name="ziel" autocomplete="off" enterkeyhint="done" placeholder="Adresse, Klinik, Bahnhof, Flughafen …"></label>
      <fieldset class="when"><legend>Wann?</legend>
        <div class="seg"><label class="seg-opt"><input type="radio" name="wann" value="Sofort"><span>Sofort</span></label><label class="seg-opt"><input type="radio" name="wann" value="Später" checked><span>Später / Termin</span></label></div>
        <div class="three"><label class="later">Datum*<input name="datum" type="date" required id="d"></label><label class="later">Uhrzeit*<input name="uhrzeit" type="time" required></label><label>Pers.*<input name="personen" type="number" inputmode="numeric" min="1" max="8" value="1" required aria-label="Personenzahl"></label></div>
      </fieldset>
      <label class="consent"><input type="checkbox" name="datenschutz" required><span>Ich habe die <a href="/datenschutz.html">Datenschutzrichtlinie</a> gelesen und verstanden.*</span></label>
      <button class="btn red" type="submit">Fahrt anfragen →</button>
      <p class="note">Unverbindliche Anfrage – wir bestätigen telefonisch.</p>
    </form>
